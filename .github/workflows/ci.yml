name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 自检（语法 / 入口 / 模拟 / 包体）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check.js

  browser:
    name: 浏览器流程测试 + 美术截图
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # 这一步只测浏览器，不需要 Electron
      - run: npx playwright install --with-deps chromium
      - run: npm run test:flow
      - run: npm run test:cam
      - run: npm run audit:ui   # 界面审计：文字出屏 / 按钮装不下 / 文字互相压住就失败
      - run: npm run shots
      - name: 上传截图（在本次运行页面底部下载，美术评审用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          retention-days: 14

  desktop:
    name: 桌面版（Electron）冒烟测试
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: mkdir -p shots && xvfb-run -a -s "-screen 0 1280x720x24" npm run desktop:smoke
      - name: 上传桌面版截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke
          path: shots/desktop-smoke.png
          retention-days: 14
