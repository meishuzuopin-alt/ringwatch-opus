<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540"><defs><style>@font-face{font-family:fgs;src:url(../../fonts/fg-sans-500.woff2)}@font-face{font-family:fgb;src:url(../../fonts/fg-sans-700.woff2)}@font-face{font-family:fgt;src:url(../../fonts/fg-serif-900.woff2)}.t{font:13px fgs;fill:#D2C8B4;paint-order:stroke;stroke:#1A1008;stroke-width:1.5px}.h{font:18px fgb;fill:#D2C8B4;paint-order:stroke;stroke:#1A1008;stroke-width:1.5px}.big{font:28px fgt;fill:#D2C8B4;paint-order:stroke;stroke:#1A1008;stroke-width:1.5px}.note{font:11px fgs;fill:#D2C8B4}</style></defs><rect width="960" height="540" fill="#1E2A4A"/><text x="60" y="80" class="big">经典独立游戏质感：只取原则，不取图形</text><text x="60" y="145" class="h">低多边形守城方向</text><text x="60" y="178" class="t">克制界面、清楚轮廓、UI 与世界共享冷暖光源。</text><text x="60" y="245" class="h">牌组冒险方向</text><text x="60" y="278" class="t">卡框层级靠结构递进；插画区表现物品，而非居中贴图。</text><text x="60" y="345" class="h">本项目的转译</text><text x="60" y="378" class="t">村舍木梁、灯台铸铁、屋顶陶瓦、火漆；左上暖光，一处高光。</text><text x="60" y="445" class="note">不使用他人截图，不复制商标、角色、卡框或图标造型。</text></svg>