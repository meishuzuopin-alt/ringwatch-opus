<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FG-TEX-001 场景贴图预览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#10182d;color:#f2dec0;font:14px/1.5 Arial,"Microsoft YaHei",sans-serif}header{padding:24px 32px;background:#18223b;border-bottom:1px solid #7a5234}h1{margin:0 0 6px;color:#ffb547;font-size:26px}p{margin:4px 0;color:#c9a27a}.bar{display:flex;gap:12px;align-items:center}.bar button{margin-left:auto;padding:9px 14px;border:1px solid #ffb547;background:#7a5234;color:#fff3d5;cursor:pointer}.wrap{max-width:1440px;margin:auto;padding:24px}.scenes{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:26px}.scene{background:#1e2a4a;border:1px solid #7a5234}.scene h2{margin:0;padding:9px 14px;font-size:16px;color:#ffb547}.scene canvas{display:block;width:100%;aspect-ratio:16/9}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{min-width:0;background:#18223b;border:1px solid #4e4a45;padding:10px}.card h3{margin:0 0 7px;color:#c9a27a;font-size:13px}.tile{height:205px;background-size:33.333% 33.333%;background-repeat:repeat;border:1px solid #111}.meta{font-size:11px;color:#8fa7b4;margin-top:6px}@media(max-width:900px){.scenes,.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.scenes,.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div class="bar"><div><h1>FG-TEX-001 · 手绘场景贴图资产包</h1><p>全部为本项目确定性代码生成。下方每张贴图以 3×3 平铺检查接缝；天空也以重复模式展示边缘连续性。</p></div><button id="export">导出预览 PNG</button></div></header>
  <main class="wrap"><section class="scenes"><article class="scene"><h2>白天机位 · 降饱和村庄</h2><div id="day"></div></article><article class="scene"><h2>夜晚机位 · 冷夜留出圣火暖光</h2><div id="night"></div></article></section><section id="grid" class="grid"></section></main>
  <script src="../../vendor/three.min.js"></script>
  <script>
  (function(){'use strict';
    var BASE='../../assets/textures/';
    fetch(BASE+'manifest.json').then(function(r){return r.json();}).then(function(m){
      var grid=document.getElementById('grid');
      m.textures.forEach(function(t){var card=document.createElement('article');card.className='card';var image=BASE+t.file;card.innerHTML='<h3>'+t.id+'</h3><div class="tile" style="background-image:url('+image+')"></div><div class="meta">'+t.width+'×'+t.height+' · '+(t.tileable?'无缝平铺':'独立贴图')+' · '+t.purpose+'</div>';grid.appendChild(card);});
      makeScene('day','day');makeScene('night','night');
    });
    function tex(loader,file,repeat){var t=loader.load(BASE+file);t.colorSpace=THREE.SRGBColorSpace;if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1]);}return t;}
    function house(scene,loader,x,z,night){var wall=new THREE.MeshStandardMaterial({map:tex(loader,'building_wood_256.png',[2,1]),roughness:1}),roof=new THREE.MeshStandardMaterial({map:tex(loader,'building_roof_256.png',[2,2]),roughness:1}),stone=new THREE.MeshStandardMaterial({map:tex(loader,'building_stone_256.png',[2,1]),roughness:1});var body=new THREE.Mesh(new THREE.BoxGeometry(3.6,2.4,3),wall);body.position.set(x,1.2,z);scene.add(body);var r=new THREE.Mesh(new THREE.ConeGeometry(3.1,2,4),roof);r.rotation.y=Math.PI/4;r.position.set(x,3.25,z);scene.add(r);var base=new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.6,.45,8),stone);base.position.set(x,.22,z);scene.add(base);if(night){var w=new THREE.Mesh(new THREE.PlaneGeometry(.75,.75),new THREE.MeshBasicMaterial({map:tex(loader,'building_window_256.png'),transparent:true,blending:THREE.AdditiveBlending}));w.position.set(x,1.4,z+1.51);scene.add(w);}}
    function makeScene(id,mode){var host=document.getElementById(id),renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(672,378);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);var scene=new THREE.Scene(),loader=new THREE.TextureLoader(),night=mode==='night';scene.background=tex(loader,night?'sky_night_1024x512.png':'sky_day_1024x512.png');var camera=new THREE.PerspectiveCamera(38,16/9,.1,100);camera.position.set(14,12,16);camera.lookAt(0,1,0);var ground=new THREE.Mesh(new THREE.PlaneGeometry(30,22),new THREE.MeshStandardMaterial({map:tex(loader,'ground_grass_512.png',[5,4]),roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);var plaza=new THREE.Mesh(new THREE.CylinderGeometry(5.3,5.3,.08,48),new THREE.MeshStandardMaterial({map:tex(loader,'ground_plaza_512.png',[2,2]),roughness:1}));plaza.position.y=.05;scene.add(plaza);house(scene,loader,-5,-2,night);house(scene,loader,5,-1,night);house(scene,loader,-3,5,night);var hemi=new THREE.HemisphereLight(night?0x5fa8c8:0xd8c3a0,night?0x10182d:0x7a5234,night?.32:1.35);scene.add(hemi);var sun=new THREE.DirectionalLight(night?0x5fa8c8:0xffe0ad,night?.5:2);sun.position.set(-7,12,8);scene.add(sun);var fire=new THREE.PointLight(0xffb547,night?55:18,13,2);fire.position.set(0,2,0);scene.add(fire);var glow=new THREE.Mesh(new THREE.PlaneGeometry(7,7),new THREE.MeshBasicMaterial({map:tex(loader,'fx_soft_glow_256.png'),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:night?1:.55}));glow.rotation.x=-Math.PI/2;glow.position.y=.12;scene.add(glow);var flameMat=new THREE.MeshBasicMaterial({color:0xffb547}),flame=new THREE.Mesh(new THREE.ConeGeometry(.55,2,7),flameMat);flame.position.y=1.25;scene.add(flame);var ember=new THREE.Mesh(new THREE.ConeGeometry(.34,1.45,7),new THREE.MeshBasicMaterial({color:0xe8702a}));ember.position.set(.18,1.05,.05);ember.rotation.z=-.22;scene.add(ember);function draw(){renderer.render(scene,camera);requestAnimationFrame(draw);}draw();}
    document.getElementById('export').onclick=function(){var c=document.querySelector('#day canvas'),a=document.createElement('a');a.download='texture-scene-day.png';a.href=c.toDataURL('image/png');a.click();};
  }());
  </script>
</body></html>
